<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Coffee - Table Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    .card {
      width: 160mm;
      background: white;
      border: 3.5px solid #c9985a;
      border-radius: 18px;
      padding: 28mm 20mm 22mm;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 7px;
      background: linear-gradient(90deg, #3a2d28 0%, #c9985a 40%, #e2c18d 50%, #c9985a 60%, #3a2d28 100%);
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 7px;
      background: linear-gradient(90deg, #3a2d28 0%, #c9985a 40%, #e2c18d 50%, #c9985a 60%, #3a2d28 100%);
    }

    .corner { position: absolute; font-size: 18px; opacity: 0.10; }
    .corner-tl { top: 14px; left: 14px; transform: rotate(-25deg); }
    .corner-tr { top: 14px; right: 14px; transform: rotate(25deg); }
    .corner-bl { bottom: 14px; left: 14px; transform: rotate(25deg); }
    .corner-br { bottom: 14px; right: 14px; transform: rotate(-25deg); }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 900;
      color: #3a2d28;
      letter-spacing: 6px;
      line-height: 1;
    }

    .logo span { color: #c9985a; }

    .ornament {
      margin: 12px auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #c9985a;
      font-size: 10px;
      letter-spacing: 3px;
    }

    .ornament-line {
      width: 45px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #c9985a);
    }

    .ornament-line-r {
      width: 45px;
      height: 1.5px;
      background: linear-gradient(90deg, #c9985a, transparent);
    }

    .text-fr {
      font-size: 22px;
      font-weight: 700;
      color: #3a2d28;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .text-en {
      font-size: 16px;
      color: #9a8672;
      font-style: italic;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .qr-wrap {
      display: inline-block;
      padding: 12px;
      border: 2.5px solid #ece0d0;
      border-radius: 14px;
      background: white;
      margin-bottom: 12px;
    }

    .qr-wrap img {
      width: 260px;
      height: 260px;
      display: block;
    }

    .scan-label {
      font-size: 13px;
      font-weight: 700;
      color: #c9985a;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .bottom-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #d4c4b0;
      font-size: 7px;
      letter-spacing: 2px;
    }

    .bottom-line {
      width: 25px;
      height: 1px;
      background: #d4c4b0;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="corner corner-tl">☕</span>
    <span class="corner corner-tr">☕</span>
    <span class="corner corner-bl">☕</span>
    <span class="corner corner-br">☕</span>

    <div class="logo">GOOD <span>COFFEE</span></div>

    <div class="ornament">
      <span class="ornament-line"></span>
      ☕
      <span class="ornament-line-r"></span>
    </div>

    <div class="text-fr">Passez votre commande d'ici</div>
    <div class="text-en">Place your order from here</div>

    <div class="qr-wrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=http%3A%2F%2F196.178.120.11%3A3001%2Forder&margin=1" alt="QR Code">
    </div>

    <div class="scan-label">▲ SCANNEZ · SCAN ▲</div>

    <div class="bottom-ornament">
      <span class="bottom-line"></span>
      ★ ☕ ★
      <span class="bottom-line"></span>
    </div>
  </div>

</body>
</html>
